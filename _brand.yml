meta:
  name: CensoLab

color:
  background: "#F7F8F8"
  foreground: "#202326"
  primary: "#0E4F5A"
  secondary: "#62676C"
  success: "#39705A"
  info: "#3F7180"
  warning: "#A56A18"
  danger: "#A64343"

typography:
  fonts:
    - family: IBM Plex Sans
      source: google
      weight: [200, 300, 400, 500, 600, 700]
      style: [normal, italic]
    - family: IBM Plex Mono
      source: google
      weight: [400, 500, 600]
      style: [normal, italic]

  base:
    family: IBM Plex Sans
    weight: 400

  headings:
    family: IBM Plex Sans
    weight: 300

  monospace:
    family: IBM Plex Mono
    weight: 400
